<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Sign in</title>
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./auth.js"></script>
  </head>
  <body>
    <main class="auth-card">
      <p class="eyebrow">Hello!</p>
      <h1 id="form-title">Sign in</h1>
      <p class="intro" id="form-description">Use your email and password to continue.</p>

      <p class="message" id="auth-message" role="status" aria-live="polite"></p>

      <form id="auth-form">
        <label id="name-field" hidden>
          Display name <span class="optional">(optional)</span>
          <input id="display-name" name="display-name" type="text" autocomplete="name">
        </label>

        <label>
          Email
          <input id="email" name="email" type="email" autocomplete="email" required>
        </label>

        <label>
          Password
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            minlength="8"
            required
          >
        </label>

        <button class="primary-button" id="submit-button" type="submit">Sign in</button>
      </form>

      <button class="text-button" id="mode-button" type="button">
        Need an account? Sign up
      </button>
      <button class="text-button" id="sign-out-button" type="button" hidden>Sign out</button>
    </main>
  </body>
</html>
