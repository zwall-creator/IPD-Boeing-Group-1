#used claude Sonnet 5.5 to assist with learning docker and setting up compose.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ipd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ipd
    volumes:
    #where the container will store its data
      - pgdata:/var/lib/postgresql/data
    #where the user can write scripts that will appear in the container
      - ./src/data/init:/docker-entrypoint-initdb.d:ro
    ports:
      #host:container
      - "5432:5432"
    healthcheck:
    #run pg_isready every 5 seconds up to 10 times
      test: ["CMD-SHELL", "pg_isready -U ipd"]
      interval: 5s
      retries: 10

  frontend:
      build: ./src/frontend
      ports:
        - "5173:5173"
      volumes:
        - ./src/frontend:/app
        - /app/node_modules
  
  computation:
    build: ./src/computation
    ports:
      - "8000:8000"
    volumes:
      - ./src/computation:/app
    depends_on:
    #wont start up until the database is healthy
      db:
        condition: service_healthy
  
  simulation:
    build: ./src/simulation
    volumes:
      - ./src/simulation:/app
    profiles: ["tools"]


volumes:
  pgdata: